name: Build Windows exe

# Produces a downloadable MLWorkbench.exe from the source in this repository.
#
# Two ways to get one:
#   * Actions -> "Build Windows exe" -> Run workflow  -> download the artifact
#   * push a tag like v1.0.1                          -> a Release is created with the exe attached
#
# This is the normal, honest way to build the app: a real Windows runner with real
# Windows wheels. (The shipped v1.0.0 binary was built under Wine on Linux — see
# docs/BUILD_NOTES.md — which pins numpy to 1.x. This workflow has no such constraint.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      onefile:
        description: "Build one self-contained file (slower start, single download)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Pinned to the numpy-1.x generation on purpose. It is what the app was
          # verified against, and PyInstaller's hooks are the most reliable there.
          python -m pip install `
            "numpy>=1.24,<2" "pandas>=2.0" "scikit-learn>=1.3" `
            "matplotlib>=3.7" "joblib>=1.3" "rdkit>=2023.9" "pyinstaller>=6.0"
          python -c "import numpy,pandas,sklearn,rdkit;print('numpy',numpy.__version__);print('pandas',pandas.__version__);print('sklearn',sklearn.__version__);print('rdkit',rdkit.__version__)"

      - name: Build
        shell: pwsh
        run: |
          $mode = if ("${{ github.event.inputs.onefile }}" -eq "false") { "--onedir" } else { "--onefile" }
          pyinstaller --noconfirm --clean $mode --windowed `
            --name MLWorkbench `
            --icon assets/icon.ico `
            --collect-all rdkit `
            --exclude-module PyQt5 --exclude-module PyQt6 `
            --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module IPython --exclude-module notebook --exclude-module pytest `
            run_mlworkbench.py

      - name: Locate the exe
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter MLWorkbench.exe |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No MLWorkbench.exe was produced" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "size_mb={0:N1}" -f ($exe.Length / 1MB) >> $env:GITHUB_OUTPUT

      - name: Self-test the frozen binary
        shell: pwsh
        run: |
          # The whole point of shipping this: prove the bundle trains, predicts,
          # optimises and computes descriptors before anyone downloads it.
          & "${{ steps.find.outputs.path }}" --selftest "$env:RUNNER_TEMP\mlw_selftest"
          Get-Content "$env:RUNNER_TEMP\mlw_selftest\selftest.json"
          $r = Get-Content "$env:RUNNER_TEMP\mlw_selftest\selftest.json" -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw "SELFTEST FAILED: $($r.error)" }

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ steps.find.outputs.path }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  MLWorkbench.exe" | Out-File -Encoding ascii dist/MLWorkbench.exe.sha256
          "SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "Size: ${{ steps.find.outputs.size_mb }} MB" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLWorkbench-windows-${{ github.sha }}
          path: |
            ${{ steps.find.outputs.path }}
            dist/MLWorkbench.exe.sha256
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find.outputs.path }}
            dist/MLWorkbench.exe.sha256
            docs/MLWorkbench_User_Guide.pdf
          generate_release_notes: true
          body: |
            Built on a Windows runner from commit `${{ github.sha }}`.

            Verify your download:

            ```
            certutil -hashfile MLWorkbench.exe SHA256
            ```

            Expected: `${{ steps.find.outputs.size_mb }} MB`, hash in `MLWorkbench.exe.sha256`.

            The exe is unsigned, so SmartScreen warns once — *More info* -> *Run anyway*.
            Nothing is installed and the app makes no network calls.
